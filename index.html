<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Succotash | Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0d14;
      color: #ffffff;
      overflow-x: hidden;
      height: 100vh;
    }

    /* Full-Screen Hero Background */
    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to top, #0b0d14 10%, rgba(11, 13, 20, 0.4) 50%, rgba(11, 13, 20, 0.7) 100%),
                  url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 40px;
    }

    /* Floating Navigation Bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 10;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .center-pills {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      padding: 4px;
      border-radius: 30px;
      display: flex;
      gap: 6px;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .pill-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Main Hero Details Overlay */
    .hero-content {
      max-width: 650px;
      margin-top: auto;
      margin-bottom: 30px;
      z-index: 5;
    }

    .title-logo {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -2px;
      text-transform: uppercase;
      margin-bottom: 15px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .rating-badge {
      background: #f5c518;
      color: #000;
      font-weight: 800;
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .meta-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
    }

    .genre-row {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .genre-row span:not(:last-child)::after {
      content: "•";
      margin-left: 8px;
    }

    .description {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 25px;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-play {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 28px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-play:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .btn-circle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Bottom Category Cards Carousel */
    .bottom-carousel {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      z-index: 5;
      margin-bottom: 10px;
    }

    .category-card {
      position: relative;
      height: 110px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .category-card:hover {
      transform: translateY(-4px);
    }

    .category-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.7);
    }

    .category-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      background: rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <!-- Top Nav -->
    <div class="top-nav">
      <div class="nav-left">
        <button class="icon-btn"><i class="fa-solid fa-bars"></i></button>
      </div>

      <div class="center-pills">
        <button class="pill-btn active"><i class="fa-solid fa-house"></i> Home</button>
        <button class="pill-btn"><i class="fa-solid fa-heart"></i> Favourites</button>
      </div>

      <div class="nav-right">
        <button class="icon-btn"><i class="fa-solid fa-border-all"></i></button>
        <button class="icon-btn"><i class="fa-solid fa-users"></i></button>
        <button class="icon-btn"><i class="fa-solid fa-cast"></i></button>
        <button class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="icon-btn"><i class="fa-solid fa-user"></i></button>
      </div>
    </div>

    <!-- Hero Main Info -->
    <div class="hero-content">
      <h1 class="title-logo">SUCCOTASH</h1>
      
      <div class="badge-row">
        <span class="rating-badge">IMDb 7.8</span>
        <span class="meta-text">2026</span>
        <span class="meta-text" style="background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px;">PG-13</span>
        <span class="meta-text">18 min</span>
      </div>

      <div class="genre-row">
        <span>Sci-Fi</span>
        <span>Drama</span>
        <span>Short Film</span>
      </div>

      <p class="description">
        In a world stripped of digital communication, an isolated technician discovers an unmonitored frequency broadcasting lost independent films across forgotten satellite relays.
      </p>

      <div class="action-row">
        <button class="btn-circle"><i class="fa-solid fa-info"></i></button>
        <button class="btn-play"><i class="fa-solid fa-play"></i> Play</button>
        <button class="btn-circle"><i class="fa-regular fa-heart"></i></button>
      </div>
    </div>

    <!-- Bottom Category Bar -->
    <div class="bottom-carousel">
      <div class="category-card">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=500&auto=format&fit=crop" alt="Movies">
        <div class="category-title">Movies</div>
      </div>
      <div class="category-card">
        <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=500&auto=format&fit=crop" alt="Shorts">
        <div class="category-title">Shorts</div>
      </div>
      <div class="category-card">
        <img src="https://images.unsplash.com/photo-1478720568477-152d9b164e26?q=80&w=500&auto=format&fit=crop" alt="Collections">
        <div class="category-title">Collections</div>
      </div>
      <div class="category-card">
        <img src="https://images.unsplash.com/photo-1524712245354-2c4e5e7121c0?q=80&w=500&auto=format&fit=crop" alt="Live Channels">
        <div class="category-title">Channels</div>
      </div>
      <div class="category-card">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=500&auto=format&fit=crop" alt="Playlists">
        <div class="category-title">Playlists</div>
      </div>
    </div>
  </div>

</body>
</html>
