<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEVA | Film & Media Showcase</title>
    <style>
        :root {
            --bg-main: #0B0E14;
            --bg-card: #151922;
            --bg-hover: #1E2430;
            --accent: #E63946;
            --accent-hover: #FF4D5A;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --border: #222834;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding-top: 70px;
        }

        /* Navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background-color: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 1000;
        }

        .brand {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand span {
            color: var(--accent);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--text-main);
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        /* Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero {
            position: relative;
            height: 380px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 3rem;
            background: linear-gradient(180deg, rgba(11, 14, 20, 0.2) 0%, var(--bg-main) 100%),
                        url('https://picsum.photos/1600/600?grayscale') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 2.5rem;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .hero-desc {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        /* Video Grid */
        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #3B4252;
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }

        .thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .card-body {
            padding: 1rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Player Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 900px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .player-container {
            position: relative;
            padding-top: 56.25%;
            background-color: #000;
        }

        .player-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .modal-details {
            padding: 1.5rem;
        }

        .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <header>
        <div class="brand"><span>CIN</span>EVA</div>
        <nav>
            <ul>
                <li><a href="#" class="active">Discover</a></li>
                <li><a href="#">Categories</a></li>
                <li><a href="#">Shorts</a></li>
                <li><a href="#">Community</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <button class="btn">Upload</button>
            <button class="btn btn-primary">Sign In</button>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">Featured Reel 2026</h1>
                <p class="hero-desc">Explore outstanding independent cinematography and short films from creators worldwide.</p>
                <button class="btn btn-primary" onclick="openModal('Featured Short', 'A showcase of narrative and visual storytelling.')">Watch Now</button>
            </div>
        </section>

        <div class="section-title">
            <h2>Trending Works</h2>
        </div>
        
        <div class="grid" id="videoGrid"></div>
    </main>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="player-container">
                <video id="videoPlayer" controls>
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="modal-details">
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <h2 id="modalTitle">Film Title</h2>
                <p id="modalDesc" style="color: var(--text-muted); margin-top: 0.5rem;"></p>
            </div>
        </div>
    </div>

    <script>
        // Sample Video Data
        const videos = [
            { title: "Echoes of Silence", director: "Studio Alpha", duration: "12:34", views: "14k", img: "https://picsum.photos/400/225?random=1" },
            { title: "Neon Skyline", director: "K. Vance", duration: "08:15", views: "29k", img: "https://picsum.photos/400/225?random=2" },
            { title: "The Last Station", director: "Elena Rostova", duration: "18:42", views: "8.5k", img: "https://picsum.photos/400/225?random=3" },
            { title: "Paper Lanterns", director: "M. Tanaka", duration: "05:50", views: "41k", img: "https://picsum.photos/400/225?random=4" },
            { title: "Monochrome", director: "J. Conan", duration: "14:10", views: "19k", img: "https://picsum.photos/400/225?random=5" },
            { title: "Orbiting Dust", director: "A. Sterling", duration: "22:05", views: "62k", img: "https://picsum.photos/400/225?random=6" }
        ];

        // Populate Grid
        const grid = document.getElementById('videoGrid');
        videos.forEach(v => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(v.title, `Directed by ${v.director}`);
            card.innerHTML = `
                <div class="thumbnail-wrapper">
                    <img src="${v.img}" alt="${v.title}">
                    <span class="duration-badge">${v.duration}</span>
                </div>
                <div class="card-body">
                    <div class="card-title">${v.title}</div>
                    <div class="card-meta">
                        <span>${v.director}</span>
                        <span>${v.views} views</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });

        // Modal Controls
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('videoPlayer');

        function openModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            modal.style.display = 'flex';
            player.play();
        }

        function closeModal() {
            modal.style.display = 'none';
            player.pause();
            player.currentTime = 0;
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
