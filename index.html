<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruitful</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0b0d14;
      color: #ffffff;
      overflow-x: hidden;
      height: 100vh;
    }

    /* Full-Screen Hero Background */
    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 40px;
      transition: background-image 0.5s ease-in-out;
    }

    /* Gradient Overlay */
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #0b0d14 10%, rgba(11, 13, 20, 0.4) 50%, rgba(11, 13, 20, 0.7) 100%);
      z-index: 1;
    }

    /* Floating Navigation Bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      z-index: 10;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      margin-right: 15px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .center-pills {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      padding: 4px;
      border-radius: 30px;
      display: flex;
      gap: 6px;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .pill-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Main Hero Details Overlay */
    .hero-content {
      max-width: 650px;
      margin-top: auto;
      margin-bottom: 25px;
      z-index: 5;
    }

    .title-logo {
      font-size: 60px;
      font-weight: 900;
      letter-spacing: -1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      transition: opacity 0.2s ease;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .rating-badge {
      background: #f5c518;
      color: #000;
      font-weight: 800;
      font-size: 12px;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .meta-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
    }

    .genre-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .genre-row span:not(:last-child)::after {
      content: "•";
      margin-left: 8px;
    }

    .description {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 22px;
      min-height: 42px;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-play {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 28px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-play:hover {
      background: #ffffff;
      color: #000;
    }

    .btn-circle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-circle:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-circle.liked {
      color: #ff4757;
      border-color: #ff4757;
    }

    /* Bottom Genre Cards Carousel */
    .bottom-carousel {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      z-index: 5;
      margin-bottom: 10px;
    }

    .category-card {
      position: relative;
      height: 105px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.25 ease;
    }

    .category-card.active {
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .category-card:hover {
      transform: translateY(-4px);
    }

    .category-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
      transition: filter 0.2s ease;
    }

    .category-card:hover img, .category-card.active img {
      filter: brightness(0.85);
    }

    .category-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      background: rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>

  <div class="hero-container" id="heroBg">
    <div class="hero-overlay"></div>

    <!-- Top Nav -->
    <div class="top-nav">
      <div class="nav-left">
        <button class="icon-btn"><i class="fa-solid fa-bars"></i></button>
        <span class="brand-logo">FRUITFUL</span>
      </div>

      <div class="center-pills">
        <button class="pill-btn active" id="btnHome"><i class="fa-solid fa-house"></i> Home</button>
        <button class="pill-btn" id="btnFavs"><i class="fa-solid fa-heart"></i> Favourites (<span id="favCount">0</span>)</button>
      </div>

      <div class="nav-right">
        <button class="icon-btn"><i class="fa-solid fa-border-all"></i></button>
        <button class="icon-btn"><i class="fa-solid fa-users"></i></button>
        <button class="icon-btn"><i class="fa-solid fa-cast"></i></button>
        <button class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="icon-btn"><i class="fa-solid fa-user"></i></button>
      </div>
    </div>

    <!-- Hero Main Info -->
    <div class="hero-content">
      <h1 class="title-logo" id="heroTitle">ECHOES OF SILENCE</h1>
      
      <div class="badge-row">
        <span class="rating-badge" id="heroRating">IMDb 8.2</span>
        <span class="meta-text" id="heroYear">2026</span>
        <span class="meta-text" id="heroMaturity" style="background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px;">PG-13</span>
        <span class="meta-text" id="heroDuration">18 min</span>
      </div>

      <div class="genre-row" id="heroTags">
        <span>Sci-Fi</span>
        <span>Mystery</span>
        <span>Short Film</span>
      </div>

      <p class="description" id="heroDesc">
        In an isolated research station, an operator receives unmonitored transmissions from a deep space frequency broadcasting independent transmissions.
      </p>

      <div class="action-row">
        <button class="btn-circle" id="btnInfo"><i class="fa-solid fa-info"></i></button>
        <button class="btn-play" id="btnPlay"><i class="fa-solid fa-play"></i> <span id="playText">Play</span></button>
        <button class="btn-circle" id="btnLike"><i class="fa-regular fa-heart"></i></button>
      </div>
    </div>

    <!-- Bottom Genre Selector -->
    <div class="bottom-carousel" id="genreCarousel">
      <!-- Generated via JS -->
    </div>
  </div>

  <script>
    const mediaData = [
      {
        genre: "Sci-Fi",
        title: "ECHOES OF SILENCE",
        bg: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=2000&auto=format&fit=crop",
        cardImg: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=500&auto=format&fit=crop",
        rating: "IMDb 8.2",
        year: "2026",
        maturity: "PG-13",
        duration: "18 min",
        tags: ["Sci-Fi", "Mystery", "Short Film"],
        desc: "In an isolated research station, an operator receives unmonitored transmissions from a deep space frequency broadcasting independent signals."
      },
      {
        genre: "Thriller",
        title: "NEON SKYLINE",
        bg: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=2000&auto=format&fit=crop",
        cardImg: "https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=500&auto=format&fit=crop",
        rating: "IMDb 7.9",
        year: "2025",
        maturity: "R",
        duration: "24 min",
        tags: ["Thriller", "Neo-Noir", "Crime"],
        desc: "A night courier working the rain-slicked city center accidentally intercepts a drive containing high-stakes corporate espionage."
      },
      {
        genre: "Drama",
        title: "THE LAST STATION",
        bg: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2000&auto=format&fit=crop",
        cardImg: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=500&auto=format&fit=crop",
        rating: "IMDb 8.5",
        year: "2026",
        maturity: "PG",
        duration: "14 min",
        tags: ["Drama", "Indie", "Narrative"],
        desc: "On the final night before a rural train line closes forever, two strangers share stories that alter their choices for the future."
      },
      {
        genre: "Horror",
        title: "MONOCHROME",
        bg: "https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=2000&auto=format&fit=crop",
        cardImg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=500&auto=format&fit=crop",
        rating: "IMDb 7.4",
        year: "2025",
        maturity: "R",
        duration: "11 min",
        tags: ["Horror", "Supernatural"],
        desc: "An archivist reviewing damaged 16mm film reels notices a shadowy figure moving independently between different unreleased movies."
      },
      {
        genre: "Animation",
        title: "ORBITING DUST",
        bg: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000&auto=format&fit=crop",
        cardImg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=500&auto=format&fit=crop",
        rating: "IMDb 8.8",
        year: "2026",
        maturity: "G",
        duration: "09 min",
        tags: ["Animation", "Visual", "Short"],
        desc: "A hand-drawn visual journey following a single dust particle drifting through historic moments of cinematic projection."
      }
    ];

    let currentIndex = 0;
    let favorites = [];
    let isPlaying = false;

    // Elements
    const heroBg = document.getElementById('heroBg');
    const heroTitle = document.getElementById('heroTitle');
    const heroRating = document.getElementById('heroRating');
    const heroYear = document.getElementById('heroYear');
    const heroMaturity = document.getElementById('heroMaturity');
    const heroDuration = document.getElementById('heroDuration');
    const heroTags = document.getElementById('heroTags');
    const heroDesc = document.getElementById('heroDesc');
    const genreCarousel = document.getElementById('genreCarousel');
    const btnLike = document.getElementById('btnLike');
    const btnPlay = document.getElementById('btnPlay');
    const playText = document.getElementById('playText');
    const favCount = document.getElementById('favCount');

    // Build Cards
    function renderGenreCards() {
      genreCarousel.innerHTML = '';
      mediaData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `category-card ${index === currentIndex ? 'active' : ''}`;
        card.innerHTML = `
          <img src="${item.cardImg}" alt="${item.genre}">
          <div class="category-title">${item.genre}</div>
        `;
        card.addEventListener('click', () => setFeatured(index));
        genreCarousel.appendChild(card);
      });
    }

    // Update Hero Content
    function setFeatured(index) {
      currentIndex = index;
      const data = mediaData[index];

      heroBg.style.backgroundImage = `url('${data.bg}')`;
      heroTitle.textContent = data.title;
      heroRating.textContent = data.rating;
      heroYear.textContent = data.year;
      heroMaturity.textContent = data.maturity;
      heroDuration.textContent = data.duration;
      heroDesc.textContent = data.desc;

      heroTags.innerHTML = data.tags.map(tag => `<span>${tag}</span>`).join('');

      // Update Active Card Outline
      document.querySelectorAll('.category-card').forEach((card, idx) => {
        card.classList.toggle('active', idx === index);
      });

      // Sync Like Button State
      updateLikeBtnState();
      
      // Reset Play State
      isPlaying = false;
      playText.textContent = "Play";
      btnPlay.querySelector('i').className = "fa-solid fa-play";
    }

    // Like Toggle
    function updateLikeBtnState() {
      const isFav = favorites.includes(currentIndex);
      const icon = btnLike.querySelector('i');
      if (isFav) {
        btnLike.classList.add('liked');
        icon.className = 'fa-solid fa-heart';
      } else {
        btnLike.classList.remove('liked');
        icon.className = 'fa-regular fa-heart';
      }
    }

    btnLike.addEventListener('click', () => {
      const favIndex = favorites.indexOf(currentIndex);
      if (favIndex > -1) {
        favorites.splice(favIndex, 1);
      } else {
        favorites.push(currentIndex);
      }
      favCount.textContent = favorites.length;
      updateLikeBtnState();
    });

    // Play Toggle
    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playText.textContent = "Playing...";
        btnPlay.querySelector('i').className = "fa-solid fa-pause";
      } else {
        playText.textContent = "Play";
        btnPlay.querySelector('i').className = "fa-solid fa-play";
      }
    });

    // Navigation Pills Toggle
    document.getElementById('btnHome').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btnFavs').classList.remove('active');
    });

    document.getElementById('btnFavs').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btnHome').classList.remove('active');
    });

    // Init
    renderGenreCards();
    setFeatured(0);
  </script>
</body>
</html>
